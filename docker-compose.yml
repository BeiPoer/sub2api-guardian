services:
  guardian:
    build:
      context: .
      dockerfile: Dockerfile
    image: sub2api-guardian:local
    container_name: sub2api-guardian
    restart: unless-stopped
    user: "${GUARDIAN_UID:-1000}:${GUARDIAN_GID:-1000}"
    ports:
      - "${GUARDIAN_BIND:-127.0.0.1}:${GUARDIAN_PORT:-8787}:8787"
    environment:
      TZ: "Asia/Shanghai"
      GUARDIAN_ADDR: "0.0.0.0:8787"
      GUARDIAN_DATA_DIR: "/data"
      SUB2API_BASE_URL: "${SUB2API_BASE_URL:-}"
      SUB2API_ADMIN_KEY: "${SUB2API_ADMIN_KEY:-}"
      IMAGE2_URL_ENCRYPTION_KEY: "${IMAGE2_URL_ENCRYPTION_KEY:-}"
    volumes:
      - ./backend/data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
