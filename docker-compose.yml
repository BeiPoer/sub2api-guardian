services:
  guardian:
    build:
      context: .
      dockerfile: Dockerfile
    image: sub2api-guardian:local
    container_name: sub2api-guardian
    restart: unless-stopped
    ports:
      - "${GUARDIAN_BIND:-127.0.0.1}:${GUARDIAN_PORT:-8787}:8787"
    environment:
      GUARDIAN_ADDR: "0.0.0.0:8787"
      GUARDIAN_DATA_DIR: "/data"
      SUB2API_BASE_URL: "${SUB2API_BASE_URL:-}"
      SUB2API_ADMIN_KEY: "${SUB2API_ADMIN_KEY:-}"
    volumes:
      - guardian-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  guardian-data:
